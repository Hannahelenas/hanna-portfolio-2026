<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hanna Klang Erikssons portfolio med projekt inom 
      frontendutveckling."
    />
    <title>Hanna Klang Eriksson</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800;900&family=Noto+Serif:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <nav class="navbar" aria-label="Huvudnavigation">
        <a class="logo" href="#home">Hanna</a>
        <ul class="nav-links">
          <li><a href="#about">Om mig</a></li>
          <li><a href="#projects">Projekt</a></li>
          <li><a href="#contact">Kontakt</a></li>
        </ul>
      </nav>
      <!-- Hero section -->
      <section id="hero" class="hero-section">
        <div>
          <h1 class="hero-heading">Hanna Klang Eriksson</h1>
          <p class="hero-text">
            Frontendutvecklare med intresse för tillgänglighet och inkluderande

          </p>
          <a href="#projects" class="button-link button-link-primary"
            >Se mina projekt</a
          >
          <a href="#contact" class="button-link button-link-secondary"
            >Kontakta mig</a
          >
        </div>
        <img src="/images/hanna.jpg" alt="Hanna" class="hero-image" />
      </section>
      <!-- Projects section -->
      <section id="projects">
        <h2>Projekt</h2>
      </section>
      <!-- About section -->
      <section id="about">
        <h2>Om mig</h2>
      </section>
      <!-- Contact section -->
      <section id="contact">
        <h2>Kontakt</h2>
      </section>
    </main>
